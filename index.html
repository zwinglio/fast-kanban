<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Fast Kanban</title>
    <script>
      (function () {
        var stored = localStorage.getItem("fk_theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);

        // Same rule as src/lib/locale.ts: Portuguese browsers get pt-BR, the rest en.
        var locale = "en";
        try {
          var storedLocale = localStorage.getItem("fk_locale");
          if (storedLocale === "en" || storedLocale === "pt-BR") {
            locale = storedLocale;
          } else if ((navigator.language || "").toLowerCase().indexOf("pt") === 0) {
            locale = "pt-BR";
          }
        } catch (e) {
          locale = (navigator.language || "").toLowerCase().indexOf("pt") === 0 ? "pt-BR" : "en";
        }
        document.documentElement.setAttribute("lang", locale);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
